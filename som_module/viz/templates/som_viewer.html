<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOM 可视化对比</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #ffffff;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #0f172a;
    }
    .header-badge {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 99px;
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .header-spacer { flex: 1; }
    .btn {
      padding: 5px 13px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
      background: #ffffff;
      color: #475569;
    }
    .btn:hover { background: #f8fafc; border-color: #cbd5e1; color: #1e293b; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Main layout ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ── Comparison view ── */
    .comparison-view {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* ── Panel ── */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel-header {
      flex-shrink: 0;
      padding: 10px 16px;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .panel-header.no-hungarian {
      background: #fff7f0;
      border-bottom-color: #fed7aa;
    }
    .panel-header.with-hungarian {
      background: #f0f9ff;
      border-bottom-color: #bae6fd;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-header.no-hungarian .panel-title { color: #c2410c; }
    .panel-header.with-hungarian .panel-title { color: #0369a1; }

    .panel-subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .panel-stats {
      display: flex;
      gap: 14px;
      margin-top: 7px;
      flex-wrap: wrap;
    }
    .pstat {
      font-size: 11px;
      color: #64748b;
    }
    .pstat-val {
      font-weight: 700;
      color: #1e293b;
    }
    .pstat-val.warn { color: #ea580c; }
    .pstat-val.good { color: #16a34a; }

    /* ── Canvas area ── */
    .canvas-area {
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }
    .canvas-area svg { display: block; width: 100%; height: 100%; }

    /* ── Vertical divider ── */
    .v-divider {
      width: 1px;
      background: #e2e8f0;
      flex-shrink: 0;
    }

    /* ── Legend bar ── */
    .legend-bar {
      flex-shrink: 0;
      border-top: 1px solid #e2e8f0;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      flex-wrap: wrap;
    }
    .legend-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #475569;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── SOM hex styles ── */
    .hex {
      stroke: #ffffff;
      stroke-width: 1.2px;
      cursor: default;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .hex-group:hover .hex {
      stroke: #334155;
      stroke-width: 2px;
    }

    /* ── Tooltip ── */
    .som-tooltip {
      position: fixed;
      text-align: left;
      padding: 10px 13px;
      font-size: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      pointer-events: none;
      visibility: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      z-index: 9999;
      max-width: 260px;
      line-height: 1.55;
      color: #1e293b;
    }
    .tt-badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 99px;
      color: #fff;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tt-name {
      font-weight: 700;
      font-size: 13px;
      color: #0f172a;
    }
    .tt-desc {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }
    .tt-meta {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      border-top: 1px solid #f1f5f9;
      padding-top: 4px;
    }
    .tt-collision {
      font-size: 11px;
      color: #ea580c;
      font-weight: 700;
      margin-top: 4px;
    }
    .tt-collision-list {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }

    /* ── Loading overlay ── */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
      color: #94a3b8;
      z-index: 100;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ── */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #94a3b8;
      font-size: 13px;
      pointer-events: none;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1e293b;
      color: #f8fafc;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      opacity: 0;
      transition: opacity 0.22s, transform 0.22s;
      z-index: 99999;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<div class="header">
  <span class="header-title">SOM 可视化对比</span>
  <span class="header-badge" id="hdrBadge">载入中…</span>
  <div class="header-spacer"></div>
  <button class="btn" id="btnReload" title="重新从服务器拉取数据">⟳ 刷新</button>
</div>

<!-- ── Main ─────────────────────────────────────────────── -->
<div class="main">
  <div class="comparison-view">

    <!-- Left panel: no Hungarian -->
    <div class="panel" id="panelLeft">
      <div class="panel-header no-hungarian">
        <div class="panel-title">
          <span>⚠</span> 无匈牙利算法优化
        </div>
        <div class="panel-subtitle">贪心 BMU 分配 · 元素可重叠至同一节点</div>
        <div class="panel-stats" id="statsLeft"></div>
      </div>
      <div class="canvas-area" id="canvasLeft">
        <div class="loading-overlay" id="loadingLeft">
          <div class="spinner"></div>
          <span>正在加载…</span>
        </div>
      </div>
    </div>

    <div class="v-divider"></div>

    <!-- Right panel: with Hungarian -->
    <div class="panel" id="panelRight">
      <div class="panel-header with-hungarian">
        <div class="panel-title">
          <span>✓</span> 匈牙利算法优化
        </div>
        <div class="panel-subtitle">最优全局分配 · 每元素独占一格</div>
        <div class="panel-stats" id="statsRight"></div>
      </div>
      <div class="canvas-area" id="canvasRight">
        <div class="loading-overlay" id="loadingRight">
          <div class="spinner"></div>
          <span>正在加载…</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Legend bar -->
  <div class="legend-bar" id="legendBar">
    <span class="legend-label">类别图例</span>
    <div class="legend-items" id="legendItems">
      <span style="font-size:11px;color:#94a3b8">载入中…</span>
    </div>
  </div>
</div>

<!-- Shared tooltip -->
<div class="som-tooltip" id="somTooltip"></div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
//  Constants & palette
// ════════════════════════════════════════════════════════════
const HEX_SIZE  = 14;
const HEX_W     = Math.sqrt(3) * HEX_SIZE;
const HEX_H     = 2 * HEX_SIZE;
const EMPTY_CLR = "#f1f5f9";

const COLOR_PALETTES = [
  { scale: d3.interpolateGreens,  hex: "#16a34a" },
  { scale: d3.interpolateBlues,   hex: "#2563eb" },
  { scale: d3.interpolatePurples, hex: "#7c3aed" },
  { scale: d3.interpolateOranges, hex: "#ea580c" },
  { scale: d3.interpolateReds,    hex: "#dc2626" },
  { scale: d3.interpolateTeals,   hex: "#0d9488" },
  { scale: d3.interpolateYlOrBr,  hex: "#a16207" },
  { scale: d3.interpolateCool,    hex: "#0891b2" },
  { scale: d3.interpolateWarm,    hex: "#c2410c" },
  { scale: d3.interpolateCividis, hex: "#475569" },
];

// ════════════════════════════════════════════════════════════
//  Shared color scheme (same category → same color in both panels)
// ════════════════════════════════════════════════════════════
let catColorScales = {};
let badgeColors    = {};

function buildSharedColors(bundle1, bundle2) {
  catColorScales = {};
  badgeColors    = {};
  let catCount   = 0;
  const seen     = new Set();

  const collect = (bundle) => {
    const nodes = bundle?.graph_data?.nodes || [];
    nodes.forEach(cell => {
      const elems = (Array.isArray(cell.elements) ? cell.elements : [])
        .map(normElem).filter(Boolean);
      if (elems.length > 0) {
        const cat = elems[0].category;
        if (!seen.has(cat)) {
          const cp = COLOR_PALETTES[catCount % COLOR_PALETTES.length];
          catColorScales[cat] = cp.scale;
          badgeColors[cat]    = cp.hex;
          seen.add(cat);
          catCount++;
        }
      }
    });
  };

  collect(bundle1);
  collect(bundle2);
}

// ════════════════════════════════════════════════════════════
//  Helpers
// ════════════════════════════════════════════════════════════
function esc(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function toast(msg, ms = 2200) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), ms);
}

function hexPoints(r) {
  return Array.from({length: 6}, (_, i) => {
    const a = (Math.PI / 180) * (60 * i - 30);
    return `${r * Math.cos(a)},${r * Math.sin(a)}`;
  }).join(" ");
}

function normElem(raw) {
  if (!raw || typeof raw !== "object") return null;
  const id = String(raw.id || "").trim();
  if (!id) return null;
  const gid = String(raw.group_id || raw.category || "unknown").trim();
  return {
    id,
    name:     String(raw.name  || raw.label || id).trim(),
    label:    String(raw.label || raw.name  || id).trim(),
    category: String(raw.category || raw.group || gid).trim(),
    layer:    String(raw.layer || "top_layer").trim(),
    desc:     String(raw.desc  || "").trim(),
    count:    Number(raw.count ?? raw.val ?? 1) || 1,
  };
}

function nodeColor(elements) {
  if (!elements || !elements.length) return EMPTY_CLR;
  const e    = elements[0];
  const interp = catColorScales[e.category] || d3.interpolateGreys;
  return interp(0.55 + 0.35 * Math.min(1, (e.count - 1) / 10));
}

// ════════════════════════════════════════════════════════════
//  Data preparation per bundle
// ════════════════════════════════════════════════════════════
function prepareBundle(bundle) {
  const nodes = bundle?.graph_data?.nodes || [];
  let maxCount = 1;

  const cells = nodes.map(cell => {
    const elems = (Array.isArray(cell.elements) ? cell.elements : [])
      .map(normElem).filter(Boolean);
    const cx = (Number(cell.x||0) + (Number(cell.y||0) % 2 === 0 ? 0 : 0.5)) * HEX_W;
    const cy =  Number(cell.y||0) * (HEX_H * 0.75);
    const nc  = { x: cell.x, y: cell.y, u_value: cell.u_value, elements: elems, cx, cy };

    // 注册节点内所有元素（BMU 模式下多元素可堆叠到同一节点）
    elems.forEach(e => {
      nodeByElemId[e.id] = nc;
      layerSet.add(e.layer);
      if (!requirements[e.layer]) requirements[e.layer] = new Set();
      requirements[e.layer].add(e.category);

      if (!catSeen.has(e.category)) {
        const cp = COLOR_PALETTES[catCount % COLOR_PALETTES.length];
        catColorScales[e.category] = cp.scale;
        badgeColors[e.category]    = cp.hex;
        catSeen.add(e.category);
        catCount++;
      }
      maxCount = Math.max(maxCount, Number(e.count || 1));
    });
    return nc;
  });

  phases = Array.from(layerSet).sort((a, b) =>
    (LAYER_PRIORITY[a] || 99) - (LAYER_PRIORITY[b] || 99)
  );
  phases.forEach((layer, i) => {
    layerColors[layer]  = COLOR_PALETTES[i % COLOR_PALETTES.length].hex;
    requirements[layer] = Array.from(requirements[layer] || []);
  });

  return { cells, maxCount };
}

// ════════════════════════════════════════════════════════════
//  Stats computation
// ════════════════════════════════════════════════════════════
function computeStats(data) {
  const cells       = data?.cells || [];
  const nonEmpty    = cells.filter(c => c.elements.length > 0);
  const collisions  = nonEmpty.filter(c => c.elements.length > 1);
  const totalElems  = nonEmpty.reduce((s, c) => s + c.elements.length, 0);
  const maxOverlap  = nonEmpty.reduce((m, c) => Math.max(m, c.elements.length), 1);
  return { nonEmpty: nonEmpty.length, collisions: collisions.length, totalElems, maxOverlap };
}

function renderStats(containerId, stats, showCollisionWarning) {
  const el = document.getElementById(containerId);
  const collisionHtml = showCollisionWarning
    ? `<span class="pstat"><span class="pstat-val warn">${stats.collisions}</span> 节点碰撞</span>
       <span class="pstat"><span class="pstat-val warn">${stats.maxOverlap}</span> 最大重叠</span>`
    : `<span class="pstat"><span class="pstat-val good">0</span> 碰撞</span>`;
  el.innerHTML = `
    <span class="pstat"><span class="pstat-val">${stats.nonEmpty}</span> 非空节点</span>
    <span class="pstat"><span class="pstat-val">${stats.totalElems}</span> 元素</span>
    ${collisionHtml}`;
}

// ════════════════════════════════════════════════════════════
//  Legend rendering
// ════════════════════════════════════════════════════════════
function renderLegend() {
  const el   = document.getElementById("legendItems");
  const cats = Object.keys(badgeColors);
  if (!cats.length) { el.innerHTML = '<span style="font-size:11px;color:#94a3b8">暂无类别</span>'; return; }
  el.innerHTML = cats.map(cat => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${badgeColors[cat]}"></div>
      <span>${esc(cat)}</span>
    </div>`).join("");
}

// ════════════════════════════════════════════════════════════
//  SOM panel renderer
// ════════════════════════════════════════════════════════════
function renderSOMPanel(canvasId, data, showCollisionBadges) {
  const container = document.getElementById(canvasId);
  container.querySelectorAll("svg").forEach(el => el.remove());

  if (!data || !data.cells.length) {
    const div = document.createElement("div");
    div.className = "empty-state";
    div.textContent = "暂无数据";
    container.appendChild(div);
    return;
  }

  const tooltip = document.getElementById("somTooltip");
  const cells   = data.cells;

  const svgRoot = d3.select(container).append("svg")
    .attr("width","100%").attr("height","100%");

  const zoomRoot = svgRoot.append("g");
  const zoomBeh  = d3.zoom().scaleExtent([0.2, 10])
    .on("zoom", ev => zoomRoot.attr("transform", ev.transform));
  svgRoot.call(zoomBeh);

  const linkLayer = zoomRoot.append("g").attr("class","links-layer").style("pointer-events","none");
  const hexLayer  = zoomRoot.append("g").attr("class","hex-layer");

  // ── Build active links ──
  const activeLinks = [];
  if (step > 0 && step <= phases.length) {
    let prev = [];
    for (let i = 0; i < step; i++) {
      prev = prev.concat(Object.values(selections[phases[i]] || {}));
    }
    cells.forEach(cell => {
      if (!cell.elements.length) return;
      // 遍历节点内所有属于当前层的元素（BMU 模式下可能有多个）
      cell.elements.filter(e => e.layer === cur).forEach(e => {
        prev.forEach(srcElem => {
          const lk = linkBetween(srcElem.id, e.id);
          if (!lk) return;
          const srcCell = nodeByElemId[srcElem.id];
          if (!srcCell) return;
          activeLinks.push({ id: `${srcElem.id}||${e.id}`, source: srcCell, target: cell,
            lift: Number(lk.lift||0), category: e.category });
          activeDegree[srcElem.id] = (activeDegree[srcElem.id]||0) + 1;
          activeDegree[e.id]       = (activeDegree[e.id]||0) + 1;
        });
      });
    });
  }

  // ── Hex groups ──
  const hexGroups = hexLayer.selectAll(".hex-group")
    .data(cells).enter().append("g")
    .attr("class", d => {
      const cls = ["hex-group"];
      if (!d.elements.length) { cls.push("dimmed"); return cls.join(" "); }
      // 检查节点内所有元素，任意一个被选中即为 selected
      const isSel = d.elements.some(e => (selections[e.layer] || {})[e.category]?.id === e.id);
      if (isSel) cls.push("selected-node");
      // 节点内没有属于当前层的元素且未被选中 → 变暗
      const hasCurLayer = d.elements.some(e => e.layer === cur);
      if (!hasCurLayer && !isSel) cls.push("dimmed");
      // 任意当前层元素有跨层连线 → 高亮
      if (!isSel && hasCurLayer) {
        const hasHighlight = d.elements.some(e => e.layer === cur && (activeDegree[e.id]||0) > 0);
        if (hasHighlight) cls.push("highlight");
      }
      return cls.join(" ");
    })
    .attr("transform", d => `translate(${d.cx},${d.cy})`)
    .on("mouseover", function(event, d) {
      if (!d.elements.length) return;
      const nodeIds = new Set(d.elements.map(e => e.id));
      // 构建 tooltip：节点内每个元素一行，当前层的置顶
      const sorted = [...d.elements].sort((a, b) => {
        const aCur = a.layer === cur ? 0 : 1;
        const bCur = b.layer === cur ? 0 : 1;
        return aCur - bCur;
      });
      const rows = sorted.map((e, i) => {
        const deg = activeDegree[e.id] || 0;
        const isCur = e.layer === cur;
        const sep = i > 0 ? "border-top:1px solid #e2e8f0;margin-top:5px;padding-top:5px;" : "";
        return `<div style="${sep}${!isCur ? "opacity:0.5;" : ""}">
          <b style="color:${badgeColors[e.category]||'#2c3e50'}">[${esc(e.category)}]</b>&nbsp;
          <span style="font-weight:600">${esc(e.name)}</span>
          <span style="font-size:11px;color:#c0392b;font-weight:700;float:right;margin-left:8px">频次: ${esc(e.count)}</span>
          ${e.desc ? `<br><span style="font-size:11px;color:#555;display:block;margin-top:4px">${esc(e.desc)}</span>` : ""}
          ${deg > 0 ? `<span style="font-size:11px;color:#2980b9;display:block;margin-top:4px;font-weight:700">跨层连线: ${deg}</span>` : ""}
          <span style="font-size:10px;color:#94a3b8;display:block;margin-top:3px">层级: ${esc(e.layer)}</span>
        </div>`;
      }).join("");
      tooltip.innerHTML = rows;
      tooltip.style.visibility = "visible";
      const r = container.getBoundingClientRect();
      tooltip.style.left = `${event.clientX - r.left + 15}px`;
      tooltip.style.top  = `${event.clientY - r.top  + 15}px`;

      const hasAnyDeg = d.elements.some(e => (activeDegree[e.id]||0) > 0);
      if (hasAnyDeg) {
        linkLayer.selectAll(".active-link")
          .transition().duration(180)
          .attr("stroke-opacity", lk => {
            const srcIds = new Set((lk?.source?.elements||[]).map(e => e.id));
            const tgtIds = new Set((lk?.target?.elements||[]).map(e => e.id));
            return [...nodeIds].some(id => srcIds.has(id) || tgtIds.has(id)) ? 1 : 0.05;
          })
          .attr("stroke-width", lk => {
            const bw = thicknessScale ? thicknessScale(Number(lk.lift||0)) : 1.5;
            const srcIds = new Set((lk?.source?.elements||[]).map(e => e.id));
            const tgtIds = new Set((lk?.target?.elements||[]).map(e => e.id));
            return [...nodeIds].some(id => srcIds.has(id) || tgtIds.has(id)) ? bw * 1.8 : bw;
          });
      }
    })
    .on("mousemove", function(event) {
      if (tooltip.style.visibility !== "visible") return;
      positionTooltip(event);
    })
    .on("mouseout", function() {
      tooltip.style.visibility = "hidden";
      linkLayer.selectAll(".active-link").transition().duration(180)
        .attr("stroke-opacity", 0.5)
        .attr("stroke-width", d => thicknessScale ? thicknessScale(Number(d.lift||0)) : 1.5);
    })
    .on("click", function(_, d) {
      if (!d.elements.length || !cur) return;
      // 找出节点内属于当前层的元素
      const curElems = d.elements.filter(e => e.layer === cur);
      if (!curElems.length) return;

      // 多个当前层元素：弹出选择器；只有一个则直接选中
      if (curElems.length > 1) {
        showElemPicker(d, curElems, cur);
        return;
      }
      selectElem(curElems[0], cur);
    });

  // ── Hex polygon ──
  hexGroups.append("polygon")
    .attr("class","hex")
    .attr("points", hexPoints(HEX_SIZE))
    .attr("fill", d => nodeColor(d.elements))
    .attr("opacity", d => d.elements.length === 0 ? 0.5 : 1);

  hexGroups.append("circle").attr("class","contact-dot")
    .attr("cx",0).attr("cy",0).attr("r",0)
    .attr("fill","#fff").attr("stroke","#1e293b").attr("stroke-width",1.5)
    .attr("opacity",0).style("pointer-events","none");

  hexGroups.select(".contact-dot").transition().duration(280)
    .attr("r", d => {
      if (!d.elements.length) return 0;
      // 取当前层中连线度最大的元素
      const curE = d.elements.filter(e => e.layer === cur)
        .reduce((best, e) => (activeDegree[e.id]||0) > (activeDegree[best?.id]||0) ? e : best, null);
      if (!curE) return 0;
      const deg = activeDegree[curE.id] || 0;
      return deg > 0 ? 2 + deg * 2 : 0;
    })
    .attr("opacity", d => {
      if (!d.elements.length) return 0;
      const curE = d.elements.find(e => e.layer === cur && (activeDegree[e.id]||0) > 0);
      return curE ? 1 : 0;
    });

  // ── Auto-fit ──
  const rect = container.getBoundingClientRect();
  const vw   = Math.max(1, rect.width);
  const vh   = Math.max(1, rect.height);
  let [mnX, mxX, mnY, mxY] = [Infinity, -Infinity, Infinity, -Infinity];
  cells.forEach(c => {
    mnX = Math.min(mnX, c.cx - HEX_SIZE); mxX = Math.max(mxX, c.cx + HEX_SIZE);
    mnY = Math.min(mnY, c.cy - HEX_SIZE); mxY = Math.max(mxY, c.cy + HEX_SIZE);
  });
  const cw = Math.max(1, mxX - mnX);
  const ch = Math.max(1, mxY - mnY);
  const sc = Math.max(0.2, Math.min(10, Math.min((vw - 40)/cw, (vh - 40)/ch)));
  const tx = ((vw - cw * sc) / 2) - mnX * sc;
  const ty = ((vh - ch * sc) / 2) - mnY * sc;
  svgRoot.call(zoomBeh.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));

  // ── 多元素角标（BMU 模式下节点内有多个元素时显示数量） ──
  hexGroups.append("text").attr("class","multi-badge")
    .attr("x", HEX_SIZE * 0.5).attr("y", -HEX_SIZE * 0.52)
    .attr("text-anchor","middle").attr("dominant-baseline","middle")
    .attr("font-size","8px").attr("font-weight","700")
    .attr("fill","#c0392b").style("pointer-events","none")
    .text(d => d.elements.length > 1 ? `×${d.elements.length}` : "");
}

// ════════════════════════════════════════════════════════════
//  选中元素 & 多元素选择器
// ════════════════════════════════════════════════════════════
function selectElem(e, layer) {
  if (!selections[layer]) selections[layer] = {};
  selections[layer][e.category] = e;
  document.getElementById("somTooltip").style.visibility = "hidden";

  const req = requirements[layer] || [];
  const got = Object.keys(selections[layer] || {});
  if (req.length > 0 && req.every(c => got.includes(c))) {
    if (step < phases.length - 1) {
      step++;
      toast(`已完成「${layer}」，进入下一层`);
    } else if (step === phases.length - 1) {
      step = phases.length;
      toast("🎉 全层级装配完成！", 3500);
    }
  }
  render();
}

function showElemPicker(cell, elems, layer) {
  // 移除已有选择器
  document.getElementById("elemPicker")?.remove();

  const picker = document.createElement("div");
  picker.id = "elemPicker";
  picker.style.cssText = `
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    background:#fff;border:1px solid #cbd5e1;border-radius:10px;
    box-shadow:0 8px 32px rgba(0,0,0,0.18);padding:12px 14px;
    z-index:9999;min-width:220px;max-width:320px;font-size:13px;
  `;
  picker.innerHTML = `
    <div style="font-weight:700;color:#1e293b;margin-bottom:8px;font-size:12px;">
      该节点含 ${elems.length} 个元素，请选择：
      <span id="pickerClose" style="float:right;cursor:pointer;color:#94a3b8;font-size:15px;line-height:1">✕</span>
    </div>
    ${elems.map((e, i) => `
      <div class="picker-row" data-idx="${i}" style="
        padding:7px 9px;border-radius:7px;cursor:pointer;
        border:1px solid #e2e8f0;margin-bottom:5px;
        transition:background 0.15s;">
        <b style="color:${badgeColors[e.category]||'#2c3e50'}">[${esc(e.category)}]</b>
        <span style="font-weight:600;margin-left:4px">${esc(e.name)}</span>
        <span style="font-size:11px;color:#c0392b;float:right">×${esc(e.count)}</span>
        ${e.desc ? `<div style="font-size:11px;color:#64748b;margin-top:2px">${esc(e.desc)}</div>` : ""}
      </div>`).join("")}
  `;

  const container = document.getElementById("canvasArea");
  container.style.position = "relative";
  container.appendChild(picker);

  picker.querySelectorAll(".picker-row").forEach(row => {
    row.addEventListener("mouseenter", () => row.style.background = "#f1f5f9");
    row.addEventListener("mouseleave", () => row.style.background = "");
    row.addEventListener("click", () => {
      picker.remove();
      selectElem(elems[Number(row.dataset.idx)], layer);
    });
  });
  picker.querySelector("#pickerClose").addEventListener("click", () => picker.remove());
  // 点击外部关闭
  setTimeout(() => document.addEventListener("click", function outside(ev) {
    if (!picker.contains(ev.target)) { picker.remove(); document.removeEventListener("click", outside); }
  }), 50);
}

function positionTooltip(event) {
  const tooltip = document.getElementById("somTooltip");
  const margin  = 14;
  const tw      = tooltip.offsetWidth  || 260;
  const th      = tooltip.offsetHeight || 80;
  let   lx      = event.clientX + margin;
  let   ly      = event.clientY + margin;
  if (lx + tw > window.innerWidth  - 4) lx = event.clientX - tw - margin;
  if (ly + th > window.innerHeight - 4) ly = event.clientY - th - margin;
  tooltip.style.left = `${lx}px`;
  tooltip.style.top  = `${ly}px`;
}

// ════════════════════════════════════════════════════════════
//  Data loading & render
// ════════════════════════════════════════════════════════════
async function loadAndRender() {
  try {
    const resp = await fetch("/api/comparison_data");
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const comparison = await resp.json();

    const bundleNo   = comparison.no_hungarian   || {};
    const bundleWith = comparison.with_hungarian  || {};

    // Build shared color scheme
    buildSharedColors(bundleNo, bundleWith);

    // Prepare data
    const dataNo   = prepareBundle(bundleNo);
    const dataWith = prepareBundle(bundleWith);

    // Header badge
    const totalElems = dataWith.cells.filter(c => c.elements.length > 0)
                        .reduce((s,c) => s + c.elements.length, 0);
    const runs = bundleWith?.success_count ?? bundleNo?.success_count ?? "?";
    document.getElementById("hdrBadge").textContent =
      `${runs} runs · ${totalElems} 元素`;

    // Stats
    const statsNo   = computeStats(dataNo);
    const statsWith = computeStats(dataWith);
    renderStats("statsLeft",  statsNo,   true);
    renderStats("statsRight", statsWith, false);

    // Legend
    renderLegend();

    // Render panels
    renderSOMPanel("canvasLeft",  dataNo,   true);
    renderSOMPanel("canvasRight", dataWith, false);

    // Hide loaders
    document.getElementById("loadingLeft").style.display  = "none";
    document.getElementById("loadingRight").style.display = "none";

  } catch (err) {
    console.error("Failed to load comparison data:", err);
    document.querySelector("#loadingLeft span").textContent  = `加载失败: ${err.message}`;
    document.querySelector("#loadingRight span").textContent = `加载失败: ${err.message}`;
  }
}

// ── Reload button ──
document.getElementById("btnReload").addEventListener("click", async () => {
  document.getElementById("loadingLeft").style.display  = "flex";
  document.getElementById("loadingRight").style.display = "flex";
  await loadAndRender();
  toast("已刷新数据");
});

// ── Auto-reload on window focus ──
let lastFocusReload = 0;
window.addEventListener("focus", async () => {
  const now = Date.now();
  if (now - lastFocusReload < 3000) return;
  lastFocusReload = now;
  try {
    const resp = await fetch("/api/comparison_data");
    if (!resp.ok) return;
    const cmp = await resp.json();
    const sig = JSON.stringify(cmp?.with_hungarian?.graph_data?.nodes?.length);
    if (!window._lastSig || window._lastSig !== sig) {
      window._lastSig = sig;
      await loadAndRender();
      toast("SOM 数据已更新");
    }
  } catch (_) { /* silent */ }
});

// ── Boot ──
loadAndRender();
</script>
