<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOM 可视化对比</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #ffffff;
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #0f172a;
    }
    .header-badge {
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 99px;
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }
    .header-spacer { flex: 1; }
    .btn {
      padding: 5px 13px;
      border-radius: 6px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s, border-color 0.15s;
      background: #ffffff;
      color: #475569;
    }
    .btn:hover { background: #f8fafc; border-color: #cbd5e1; color: #1e293b; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Main layout ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    /* ── Comparison view ── */
    .comparison-view {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    /* ── Panel ── */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .panel-header {
      flex-shrink: 0;
      padding: 10px 16px;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    .panel-header.no-hungarian {
      background: #fff7f0;
      border-bottom-color: #fed7aa;
    }
    .panel-header.with-hungarian {
      background: #f0f9ff;
      border-bottom-color: #bae6fd;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-header.no-hungarian .panel-title { color: #c2410c; }
    .panel-header.with-hungarian .panel-title { color: #0369a1; }

    .panel-subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
    }

    .panel-stats {
      display: flex;
      gap: 14px;
      margin-top: 7px;
      flex-wrap: wrap;
    }
    .pstat {
      font-size: 11px;
      color: #64748b;
    }
    .pstat-val {
      font-weight: 700;
      color: #1e293b;
    }
    .pstat-val.warn { color: #ea580c; }
    .pstat-val.good { color: #16a34a; }

    /* ── Canvas area ── */
    .canvas-area {
      flex: 1;
      position: relative;
      background: #ffffff;
      overflow: hidden;
    }
    .canvas-area svg { display: block; width: 100%; height: 100%; }

    /* ── Vertical divider ── */
    .v-divider {
      width: 1px;
      background: #e2e8f0;
      flex-shrink: 0;
    }

    /* ── Legend bar ── */
    .legend-bar {
      flex-shrink: 0;
      border-top: 1px solid #e2e8f0;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: #ffffff;
      flex-wrap: wrap;
    }
    .legend-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      flex-shrink: 0;
    }
    .legend-items {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #475569;
    }
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    /* ── SOM hex styles ── */
    .hex {
      stroke: #ffffff;
      stroke-width: 1.2px;
      cursor: default;
      transition: stroke 0.15s, stroke-width 0.15s;
    }
    .hex-group:hover .hex {
      stroke: #334155;
      stroke-width: 2px;
    }

    /* ── Tooltip ── */
    .som-tooltip {
      position: fixed;
      text-align: left;
      padding: 10px 13px;
      font-size: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      pointer-events: none;
      visibility: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
      z-index: 9999;
      max-width: 260px;
      line-height: 1.55;
      color: #1e293b;
    }
    .tt-badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 7px;
      border-radius: 99px;
      color: #fff;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tt-name {
      font-weight: 700;
      font-size: 13px;
      color: #0f172a;
    }
    .tt-desc {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }
    .tt-meta {
      font-size: 10px;
      color: #94a3b8;
      margin-top: 4px;
      border-top: 1px solid #f1f5f9;
      padding-top: 4px;
    }
    .tt-collision {
      font-size: 11px;
      color: #ea580c;
      font-weight: 700;
      margin-top: 4px;
    }
    .tt-collision-list {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }

    /* ── Loading overlay ── */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      font-size: 13px;
      color: #94a3b8;
      z-index: 100;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e2e8f0;
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Empty state ── */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #94a3b8;
      font-size: 13px;
      pointer-events: none;
    }

    /* ── Toast ── */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: #1e293b;
      color: #f8fafc;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      opacity: 0;
      transition: opacity 0.22s, transform 0.22s;
      z-index: 99999;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body>

<!-- ── Header ──────────────────────────────────────────── -->
<div class="header">
  <span class="header-title">SOM 可视化对比</span>
  <span class="header-badge" id="hdrBadge">载入中…</span>
  <div class="header-spacer"></div>
  <button class="btn" id="btnReload" title="重新从服务器拉取数据">⟳ 刷新</button>
</div>

<!-- ── Main ─────────────────────────────────────────────── -->
<div class="main">
  <div class="comparison-view">

    <!-- Left panel: no Hungarian -->
    <div class="panel" id="panelLeft">
      <div class="panel-header no-hungarian">
        <div class="panel-title">
          <span>⚠</span> 无匈牙利算法优化
        </div>
        <div class="panel-subtitle">贪心 BMU 分配 · 元素可重叠至同一节点</div>
        <div class="panel-stats" id="statsLeft"></div>
      </div>
      <div class="canvas-area" id="canvasLeft">
        <div class="loading-overlay" id="loadingLeft">
          <div class="spinner"></div>
          <span>正在加载…</span>
        </div>
      </div>
    </div>

    <div class="v-divider"></div>

    <!-- Right panel: with Hungarian -->
    <div class="panel" id="panelRight">
      <div class="panel-header with-hungarian">
        <div class="panel-title">
          <span>✓</span> 匈牙利算法优化
        </div>
        <div class="panel-subtitle">最优全局分配 · 每元素独占一格</div>
        <div class="panel-stats" id="statsRight"></div>
      </div>
      <div class="canvas-area" id="canvasRight">
        <div class="loading-overlay" id="loadingRight">
          <div class="spinner"></div>
          <span>正在加载…</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Legend bar -->
  <div class="legend-bar" id="legendBar">
    <span class="legend-label">类别图例</span>
    <div class="legend-items" id="legendItems">
      <span style="font-size:11px;color:#94a3b8">载入中…</span>
    </div>
  </div>
</div>

<!-- Shared tooltip -->
<div class="som-tooltip" id="somTooltip"></div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
//  Constants & palette
// ════════════════════════════════════════════════════════════
const HEX_SIZE  = 14;
const HEX_W     = Math.sqrt(3) * HEX_SIZE;
const HEX_H     = 2 * HEX_SIZE;
const EMPTY_CLR = "#f1f5f9";

const COLOR_PALETTES = [
  { scale: d3.interpolateGreens,  hex: "#16a34a" },
  { scale: d3.interpolateBlues,   hex: "#2563eb" },
  { scale: d3.interpolatePurples, hex: "#7c3aed" },
  { scale: d3.interpolateOranges, hex: "#ea580c" },
  { scale: d3.interpolateReds,    hex: "#dc2626" },
  { scale: d3.interpolateTeals,   hex: "#0d9488" },
  { scale: d3.interpolateYlOrBr,  hex: "#a16207" },
  { scale: d3.interpolateCool,    hex: "#0891b2" },
  { scale: d3.interpolateWarm,    hex: "#c2410c" },
  { scale: d3.interpolateCividis, hex: "#475569" },
];

// ════════════════════════════════════════════════════════════
//  Shared color scheme (same category → same color in both panels)
// ════════════════════════════════════════════════════════════
let catColorScales = {};
let badgeColors    = {};

function buildSharedColors(bundle1, bundle2) {
  catColorScales = {};
  badgeColors    = {};
  let catCount   = 0;
  const seen     = new Set();

  const collect = (bundle) => {
    const nodes = bundle?.graph_data?.nodes || [];
    nodes.forEach(cell => {
      const elems = (Array.isArray(cell.elements) ? cell.elements : [])
        .map(normElem).filter(Boolean);
      if (elems.length > 0) {
        const cat = elems[0].category;
        if (!seen.has(cat)) {
          const cp = COLOR_PALETTES[catCount % COLOR_PALETTES.length];
          catColorScales[cat] = cp.scale;
          badgeColors[cat]    = cp.hex;
          seen.add(cat);
          catCount++;
        }
      }
    });
  };

  collect(bundle1);
  collect(bundle2);
}

// ════════════════════════════════════════════════════════════
//  Helpers
// ════════════════════════════════════════════════════════════
function esc(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function toast(msg, ms = 2200) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), ms);
}

function hexPoints(r) {
  return Array.from({length: 6}, (_, i) => {
    const a = (Math.PI / 180) * (60 * i - 30);
    return `${r * Math.cos(a)},${r * Math.sin(a)}`;
  }).join(" ");
}

function normElem(raw) {
  if (!raw || typeof raw !== "object") return null;
  const id = String(raw.id || "").trim();
  if (!id) return null;
  const gid = String(raw.group_id || raw.category || "unknown").trim();
  return {
    id,
    name:     String(raw.name  || raw.label || id).trim(),
    label:    String(raw.label || raw.name  || id).trim(),
    category: String(raw.category || raw.group || gid).trim(),
    layer:    String(raw.layer || "top_layer").trim(),
    desc:     String(raw.desc  || "").trim(),
    count:    Number(raw.count ?? raw.val ?? 1) || 1,
  };
}

function nodeColor(elements) {
  if (!elements || !elements.length) return EMPTY_CLR;
  const e    = elements[0];
  const interp = catColorScales[e.category] || d3.interpolateGreys;
  return interp(0.55 + 0.35 * Math.min(1, (e.count - 1) / 10));
}

// ════════════════════════════════════════════════════════════
//  Data preparation per bundle
// ════════════════════════════════════════════════════════════
function prepareBundle(bundle) {
  const nodes = bundle?.graph_data?.nodes || [];
  let maxCount = 1;

  const cells = nodes.map(cell => {
    const elems = (Array.isArray(cell.elements) ? cell.elements : [])
      .map(normElem).filter(Boolean);
    const cx = (Number(cell.x || 0) + (Number(cell.y || 0) % 2 === 0 ? 0 : 0.5)) * HEX_W;
    const cy =  Number(cell.y || 0) * (HEX_H * 0.75);
    elems.forEach(e => { maxCount = Math.max(maxCount, e.count); });
    return { x: cell.x, y: cell.y, u_value: cell.u_value, elements: elems, cx, cy };
  });

  return { cells, maxCount };
}

// ════════════════════════════════════════════════════════════
//  Stats computation
// ════════════════════════════════════════════════════════════
function computeStats(data) {
  const cells       = data?.cells || [];
  const nonEmpty    = cells.filter(c => c.elements.length > 0);
  const collisions  = nonEmpty.filter(c => c.elements.length > 1);
  const totalElems  = nonEmpty.reduce((s, c) => s + c.elements.length, 0);
  const maxOverlap  = nonEmpty.reduce((m, c) => Math.max(m, c.elements.length), 1);
  return { nonEmpty: nonEmpty.length, collisions: collisions.length, totalElems, maxOverlap };
}

function renderStats(containerId, stats, showCollisionWarning) {
  const el = document.getElementById(containerId);
  const collisionHtml = showCollisionWarning
    ? `<span class="pstat"><span class="pstat-val warn">${stats.collisions}</span> 节点碰撞</span>
       <span class="pstat"><span class="pstat-val warn">${stats.maxOverlap}</span> 最大重叠</span>`
    : `<span class="pstat"><span class="pstat-val good">0</span> 碰撞</span>`;
  el.innerHTML = `
    <span class="pstat"><span class="pstat-val">${stats.nonEmpty}</span> 非空节点</span>
    <span class="pstat"><span class="pstat-val">${stats.totalElems}</span> 元素</span>
    ${collisionHtml}`;
}

// ════════════════════════════════════════════════════════════
//  Legend rendering
// ════════════════════════════════════════════════════════════
function renderLegend() {
  const el   = document.getElementById("legendItems");
  const cats = Object.keys(badgeColors);
  if (!cats.length) { el.innerHTML = '<span style="font-size:11px;color:#94a3b8">暂无类别</span>'; return; }
  el.innerHTML = cats.map(cat => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${badgeColors[cat]}"></div>
      <span>${esc(cat)}</span>
    </div>`).join("");
}

// ════════════════════════════════════════════════════════════
//  SOM panel renderer
// ════════════════════════════════════════════════════════════
function renderSOMPanel(canvasId, data, showCollisionBadges) {
  const container = document.getElementById(canvasId);
  container.querySelectorAll("svg").forEach(el => el.remove());

  if (!data || !data.cells.length) {
    const div = document.createElement("div");
    div.className = "empty-state";
    div.textContent = "暂无数据";
    container.appendChild(div);
    return;
  }

  const tooltip = document.getElementById("somTooltip");
  const cells   = data.cells;

  const svgRoot = d3.select(container).append("svg")
    .attr("width","100%").attr("height","100%");

  const zoomRoot = svgRoot.append("g");
  const zoomBeh  = d3.zoom().scaleExtent([0.2, 10])
    .on("zoom", ev => zoomRoot.attr("transform", ev.transform));
  svgRoot.call(zoomBeh);

  const hexLayer = zoomRoot.append("g").attr("class","hex-layer");

  // ── Hex groups ──
  const hexGroups = hexLayer.selectAll(".hex-group")
    .data(cells).enter().append("g")
    .attr("class","hex-group")
    .attr("transform", d => `translate(${d.cx},${d.cy})`)
    .on("mouseover", function(event, d) {
      if (!d.elements.length) return;
      const e    = d.elements[0];
      const cat  = e.category;
      const col  = badgeColors[cat] || "#475569";

      let extraHtml = "";
      if (showCollisionBadges && d.elements.length > 1) {
        const others = d.elements.slice(1).map(x =>
          `<div>· ${esc(x.name)} <span style="color:#94a3b8">(${esc(x.category)})</span></div>`
        ).join("");
        extraHtml = `
          <div class="tt-collision">⚠ 节点碰撞：共 ${d.elements.length} 个元素</div>
          <div class="tt-collision-list">${others}</div>`;
      }

      tooltip.innerHTML = `
        <div class="tt-badge" style="background:${col}">${esc(cat)}</div>
        <div class="tt-name">${esc(e.name)}</div>
        ${e.desc ? `<div class="tt-desc">${esc(e.desc)}</div>` : ""}
        <div class="tt-meta">层级: ${esc(e.layer)} · 频次: ${esc(e.count)}</div>
        ${extraHtml}`;
      tooltip.style.visibility = "visible";
      positionTooltip(event);
    })
    .on("mousemove", function(event) {
      if (tooltip.style.visibility !== "visible") return;
      positionTooltip(event);
    })
    .on("mouseout", function() {
      tooltip.style.visibility = "hidden";
    });

  // ── Hex polygon ──
  hexGroups.append("polygon")
    .attr("class","hex")
    .attr("points", hexPoints(HEX_SIZE))
    .attr("fill", d => nodeColor(d.elements))
    .attr("opacity", d => d.elements.length === 0 ? 0.4 : 1);

  // ── Collision badge (only for no-Hungarian panel) ──
  if (showCollisionBadges) {
    hexGroups.filter(d => d.elements.length > 1)
      .append("circle")
      .attr("cx", HEX_SIZE * 0.55)
      .attr("cy", -HEX_SIZE * 0.55)
      .attr("r", 5.5)
      .attr("fill", "#ea580c")
      .attr("stroke", "#ffffff")
      .attr("stroke-width", 1.5)
      .style("pointer-events","none");

    hexGroups.filter(d => d.elements.length > 1)
      .append("text")
      .attr("x", HEX_SIZE * 0.55)
      .attr("y", -HEX_SIZE * 0.55 + 0.5)
      .attr("text-anchor","middle")
      .attr("dominant-baseline","middle")
      .attr("font-size","6.5px")
      .attr("fill","#ffffff")
      .attr("font-weight","700")
      .style("pointer-events","none")
      .text(d => d.elements.length);
  }

  // ── Auto-fit ──
  const rect = container.getBoundingClientRect();
  const vw   = Math.max(1, rect.width);
  const vh   = Math.max(1, rect.height);
  let [mnX, mxX, mnY, mxY] = [Infinity, -Infinity, Infinity, -Infinity];
  cells.forEach(c => {
    mnX = Math.min(mnX, c.cx - HEX_SIZE); mxX = Math.max(mxX, c.cx + HEX_SIZE);
    mnY = Math.min(mnY, c.cy - HEX_SIZE); mxY = Math.max(mxY, c.cy + HEX_SIZE);
  });
  const cw = Math.max(1, mxX - mnX);
  const ch = Math.max(1, mxY - mnY);
  const sc = Math.max(0.2, Math.min(10, Math.min((vw - 40)/cw, (vh - 40)/ch)));
  const tx = ((vw - cw * sc) / 2) - mnX * sc;
  const ty = ((vh - ch * sc) / 2) - mnY * sc;
  svgRoot.call(zoomBeh.transform, d3.zoomIdentity.translate(tx, ty).scale(sc));
}

function positionTooltip(event) {
  const tooltip = document.getElementById("somTooltip");
  const margin  = 14;
  const tw      = tooltip.offsetWidth  || 260;
  const th      = tooltip.offsetHeight || 80;
  let   lx      = event.clientX + margin;
  let   ly      = event.clientY + margin;
  if (lx + tw > window.innerWidth  - 4) lx = event.clientX - tw - margin;
  if (ly + th > window.innerHeight - 4) ly = event.clientY - th - margin;
  tooltip.style.left = `${lx}px`;
  tooltip.style.top  = `${ly}px`;
}

// ════════════════════════════════════════════════════════════
//  Data loading & render
// ════════════════════════════════════════════════════════════
async function loadAndRender() {
  try {
    const resp = await fetch("/api/comparison_data");
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const comparison = await resp.json();

    const bundleNo   = comparison.no_hungarian   || {};
    const bundleWith = comparison.with_hungarian  || {};

    // Build shared color scheme
    buildSharedColors(bundleNo, bundleWith);

    // Prepare data
    const dataNo   = prepareBundle(bundleNo);
    const dataWith = prepareBundle(bundleWith);

    // Header badge
    const totalElems = dataWith.cells.filter(c => c.elements.length > 0)
                        .reduce((s,c) => s + c.elements.length, 0);
    const runs = bundleWith?.success_count ?? bundleNo?.success_count ?? "?";
    document.getElementById("hdrBadge").textContent =
      `${runs} runs · ${totalElems} 元素`;

    // Stats
    const statsNo   = computeStats(dataNo);
    const statsWith = computeStats(dataWith);
    renderStats("statsLeft",  statsNo,   true);
    renderStats("statsRight", statsWith, false);

    // Legend
    renderLegend();

    // Render panels
    renderSOMPanel("canvasLeft",  dataNo,   true);
    renderSOMPanel("canvasRight", dataWith, false);

    // Hide loaders
    document.getElementById("loadingLeft").style.display  = "none";
    document.getElementById("loadingRight").style.display = "none";

  } catch (err) {
    console.error("Failed to load comparison data:", err);
    document.querySelector("#loadingLeft span").textContent  = `加载失败: ${err.message}`;
    document.querySelector("#loadingRight span").textContent = `加载失败: ${err.message}`;
  }
}

// ── Reload button ──
document.getElementById("btnReload").addEventListener("click", async () => {
  document.getElementById("loadingLeft").style.display  = "flex";
  document.getElementById("loadingRight").style.display = "flex";
  await loadAndRender();
  toast("已刷新数据");
});

// ── Auto-reload on window focus ──
let lastFocusReload = 0;
window.addEventListener("focus", async () => {
  const now = Date.now();
  if (now - lastFocusReload < 3000) return;
  lastFocusReload = now;
  try {
    const resp = await fetch("/api/comparison_data");
    if (!resp.ok) return;
    const cmp = await resp.json();
    const sig = JSON.stringify(cmp?.with_hungarian?.graph_data?.nodes?.length);
    if (!window._lastSig || window._lastSig !== sig) {
      window._lastSig = sig;
      await loadAndRender();
      toast("SOM 数据已更新");
    }
  } catch (_) { /* silent */ }
});

// ── Boot ──
loadAndRender();
</script>
</body>
</html>
